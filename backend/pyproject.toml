[project]
name = "chatbi-backend"
version = "0.1.0"
description = "Mock-only ChatBI API and query service"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi==0.162.0",
  "pydantic==2.14.2",
  "SQLAlchemy==2.1.8",
  "psycopg[binary]==3.3.8",
  "alembic==1.20.1",
  "uvicorn==0.54.0",
  "httpx==0.28.1",
  "python-dotenv==1.2.4",
]

[dependency-groups]
dev = [
  "mypy==2.4.1",
  "pytest==9.2.0",
  "ruff==0.17.4",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true
