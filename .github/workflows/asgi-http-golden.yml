name: ASGI HTTP Golden

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: asgi-http-golden-${{ github.ref }}
  cancel-in-progress: true

jobs:
  asgi-http-golden:
    name: ASGI route and HTTP Golden regression
    runs-on: ubuntu-latest
    env:
      CHATBI_DATABASE_URL: sqlite:///data/local/chatbi.sqlite
      CHATBI_PUBLIC_DEMO: "false"
      CHATBI_DEBUG_ENABLED: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock

      - name: Install locked backend dependencies
        run: python -m pip install -r backend/requirements-dev.lock

      - name: Generate versioned Mock datasets
        run: |
          python scripts/generate_mock_data.py
          python scripts/generate_saas_mock_data.py

      - name: Create and seed local SQLite database
        run: |
          mkdir -p data/local
          python -m alembic upgrade head
          python -m backend.chatbi.seed --reset

      - name: Run ASGI query API regression tests
        run: python -m pytest backend/tests/test_query_api.py -q

      - name: Run P6 ASGI HTTP Golden suite
        run: python -m harness.run_query_eval --output data/local/p6-query-report.json
